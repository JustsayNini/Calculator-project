<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissi's Calculator</title>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="calculator-box">

        <input id="screen-box" readonly>

        <div id="button-box">

            <div class="button-row">
                <button type="button" class="btn" id="seven" onclick="display('7')"> 7 </button>
                <button type="button" class="btn" id="eight" onclick="display('8')"> 8 </button>
                <button type="button" class="btn" id="nine" onclick="display('9')"> 9 </button>
                <button type="button" class="btn" id="plus" onclick="display('+')"> + </button>
            </div>

            <div class="button-row">
                <button type="button" class="btn" id="four" onclick="display('4')"> 4 </button>
                <button type="button" class="btn" id="five" onclick="display('5')"> 5 </button>
                <button type="button" class="btn" id="six" onclick="display('6')"> 6 </button>
                <button type="button" class="btn" id="minus" onclick="display('-')"> - </button>
            </div>

            <div class="button-row">
                <button type="button" class="btn" id="one" onclick="display('1')"> 1 </button>
                <button type="button" class="btn" id="two" onclick="display('2')"> 2 </button>
                <button type="button" class="btn" id="three" onclick="display('3')"> 3 </button>
                <button type="button" class="btn" id="divide" onclick="display('/')"> &divide; </button>
            </div>

            <div class="button-row">
                <button type="button" class="btn" id="zero" onclick="display('0')"> 0 </button>
                <button type="button" class="btn" id="period" onclick="display('.')"> . </button>
                <button type="button" class="btn" id="equal" onclick="calculate()"> = </button>
                <div>
                    <button type="button" class="btn" id="times" onclick="display('*')"> &times; </button>
                    <button type="button" class="btn" id="clear-button" onclick="clearDisplay()"> CLR </button>
                </div>
            </div>

        </div>

    </div>
    
</body>

<script src="index.js"></script>
</html>
